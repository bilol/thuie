  /me/blocks:
    get: { tags: [Connections], operationId: listBlocks, summary: Blocked users, responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Block' } } } } }, default: { $ref: '#/components/responses/Error' } } }
    post: { tags: [Connections], operationId: blockUser, summary: Block a user, requestBody: { content: { application/json: { schema: { type: object, properties: { user_id: { type: string } } } } } }, responses: { '201': { description: blocked }, default: { $ref: '#/components/responses/Error' } } }
  /me/blocks/{userId}:
    delete: { tags: [Connections], operationId: unblockUser, summary: Unblock, parameters: [ { $ref: '#/components/parameters/UserId' } ], responses: { '204': { description: unblocked }, default: { $ref: '#/components/responses/Error' } } }
  /me/notification-preferences:
    get: { tags: [Notifications], operationId: getNotificationPrefs, summary: Per-type mute, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferences' } } } }, default: { $ref: '#/components/responses/Error' } } }
    patch: { tags: [Notifications], operationId: updateNotificationPrefs, summary: Mute / unmute one notification type, requestBody: { content: { application/json: { schema: { type: object, required: [type, muted], properties: { type: { $ref: '#/components/schemas/NotificationType' }, muted: { type: boolean } } } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferences' } } } }, default: { $ref: '#/components/responses/Error' } } }

  # ---- Alumni visibility request ----
  /me/alumni-profile/visibility-request:
    post: { tags: [Alumni], operationId: requestVisibilityChange, summary: Ask admin to change visibility, requestBody: { content: { application/json: { schema: { type: object, properties: { visibility: { $ref: '#/components/schemas/Visibility' }, note: { type: string } } } } } }, responses: { '202': { description: submitted for admin review }, default: { $ref: '#/components/responses/Error' } } }

  # ---- Reports (generic) ----
  /reports:
    post: { tags: [Engagement], operationId: createReport, summary: File a report (any target), parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReportCreateGeneric' } } } }, responses: { '202': { description: filed }, default: { $ref: '#/components/responses/Error' } } }
  /me/reports:
    get: { tags: [Engagement], operationId: listMyReports, summary: Filed reports + resolution, parameters: [ { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ReportPage' } } } }, default: { $ref: '#/components/responses/Error' } } }

  # ---- Messaging group participants ----
  /conversations/{id}/participants:
    post: { tags: [Messaging], operationId: addParticipants, summary: Group add members, parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { content: { application/json: { schema: { type: object, properties: { user_ids: { type: array, items: { type: string } } } } } } }, responses: { '200': { description: ok }, default: { $ref: '#/components/responses/Error' } } }
  /conversations/{id}/participants/{userId}:
    delete: { tags: [Messaging], operationId: removeParticipant, summary: Group remove member, parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/UserId' } ], responses: { '204': { description: removed }, default: { $ref: '#/components/responses/Error' } } }
  /conversations/{id}/leave:
    post: { tags: [Messaging], operationId: leaveConversation, summary: Leave conversation, parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '204': { description: left }, default: { $ref: '#/components/responses/Error' } } }

  # ---- Events my registrations ----
  /me/event-registrations:
    get: { tags: [Events], operationId: listMyRegistrations, summary: My registrations + tickets, parameters: [ { in: query, name: upcoming, schema: { type: boolean } } ], responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EventRegistration' } } } } }, default: { $ref: '#/components/responses/Error' } } }

  # ---- Search suggest ----
  /search/suggest:
    get: { tags: [Search], operationId: searchSuggest, summary: Autocomplete, parameters: [ { in: query, name: q, required: true, schema: { type: string } }, { in: query, name: scope, schema: { type: string, enum: [tags, skills, departments, users, all] } } ], responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Suggestion' } } } } }, default: { $ref: '#/components/responses/Error' } } }

  # ---- Admin convert / stats ----
  /admin/users/{id}/convert:
    post: { tags: [Admin], operationId: adminConvertUser, summary: student -> graduate conversion, parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { content: { application/json: { schema: { type: object, properties: { graduation_year: { type: string }, force: { type: boolean } } } } } }, responses: { '200': { description: converted, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }, default: { $ref: '#/components/responses/Error' } } }
  /admin/users/convert:
    post: { tags: [Admin], operationId: adminConvertUsersBatch, summary: Batch conversion, requestBody: { content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { type: object, properties: { user_id: { type: string }, graduation_year: { type: string } } } } } } } } }, responses: { '200': { description: done }, default: { $ref: '#/components/responses/Error' } } }
  /admin/stats:
    get: { tags: [Admin], operationId: adminStats, summary: Dashboard stats, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Stats' } } } }, default: { $ref: '#/components/responses/Error' } } }

  # ---- Ops ----
  /healthz:
    get: { tags: [System], security: [], operationId: healthz, summary: Liveness, responses: { '200': { description: alive } } }
  /ready:
    get: { tags: [System], security: [], operationId: readiness, summary: Readiness (deps checked), responses: { '200': { description: ready }, '503': { description: not ready } } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    ModerationTarget: { in: path, name: type, required: true, schema: { $ref: '#/components/schemas/ModerationTargetType' } }
    Limit: { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
    Id: { in: path, name: id, required: true, schema: { type: string } }
    UserId: { in: path, name: userId, required: true, schema: { type: string } }
    Page: { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
    Cursor: { in: query, name: cursor, schema: { type: string }, description: Opaque keyset cursor }
    Sort: { in: query, name: sort, schema: { type: string }, description: "-created_at (leading - = DESC)" }
    IdempotencyKey: { in: header, name: Idempotency-Key, schema: { type: string, format: uuid } }

  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Not found (or hidden by visibility)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    # ---- enums (wire = DB snake_case) ----
    Role: { type: string, enum: [student, graduate, admin, admin_super] }
    UserStatus: { type: string, enum: [unverified, active, posting_restricted, banned, deleted] }
    OtpPurpose: { type: string, enum: [register_verify, password_reset] }
    ContentStatus: { type: string, enum: [pending, approved, rejected, taken_down] }
    ProfileStatus: { type: string, enum: [draft, pending, approved, rejected] }
    Visibility: { type: string, enum: [student_only, all, admin_only] }
    InfoCategory: { type: string, enum: [internal, open, recruitment] }
    InfoSource: { type: string, enum: [official, user] }
    ProfileSource: { type: string, enum: [school, user] }
    EventType: { type: string, enum: [recruitment, lecture, sharing, ceremony, sports, other] }
    ConnectionStatus: { type: string, enum: [pending, accepted, declined, revoked] }
    KeywordAction: { type: string, enum: [block, manual_review] }
    MentorshipStatus: { type: string, enum: [pending, accepted, rejected, withdrawn, ended] }
    ReportStatus: { type: string, enum: [open, resolved_ignored, resolved_deleted, resolved_restricted] }
    NotificationType: { type: string, enum: [review_result, comment_reply, connection, system, report_result, identity_change, broadcast] }
    FavoriteTargetType: { type: string, enum: [info, profile, post, comment] }
    ModerationTargetType: { type: string, enum: [info_post, forum_post, comment, alumni_profile] }
    ReportTargetType: { type: string, enum: [info_post, forum_post, comment, alumni_profile, user] }

    # ---- shared ----
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, description: Stable machine code }
        message: { type: string }
        details: { type: object, additionalProperties: true }
        requestId: { type: string }
        errors: { type: array, items: { type: object, properties: { field: { type: string }, message: { type: string } } } }
    CursorMeta: { type: object, properties: { nextCursor: { type: [string, 'null'] }, limit: { type: integer } } }
    OffsetMeta: { type: object, properties: { page: { type: integer }, limit: { type: integer }, total: { type: integer }, totalPages: { type: integer } } }

    # ---- auth ----
    LoginRequest: { type: object, required: [handle, password], properties: { handle: { type: string, description: student_id / phone / email }, password: { type: string }, device_label: { type: string } } }
    RegisterRequest: { type: object, required: [name, role, password], properties: { name: { type: string }, role: { type: string, enum: [student, graduate] }, student_id: { type: string }, phone: { type: string }, email: { type: string }, password: { type: string }, department: { type: string, description: department code or id }, grade_year: { type: string }, otp_code: { type: string }, invite_code: { type: string } } }
    TokenPair: { type: object, properties: { access_token: { type: string }, refresh_token: { type: string }, expires_in: { type: integer }, user: { $ref: '#/components/schemas/User' } } }

    # ---- entities ----
    Department: { type: object, properties: { id: { type: string }, code: { type: string }, name_zh: { type: string }, name_en: { type: string }, faculty: { type: [string, 'null'] } } }
    User: { type: object, properties: { id: { type: string }, name: { type: string }, role: { $ref: '#/components/schemas/Role' }, status: { $ref: '#/components/schemas/UserStatus' }, student_id: { type: [string, 'null'] }, phone: { type: [string, 'null'] }, email: { type: [string, 'null'] }, department: { $ref: '#/components/schemas/Department' }, grade_year: { type: [string, 'null'] }, graduation_year: { type: [string, 'null'] }, avatar_url: { type: [string, 'null'] }, bio: { type: [string, 'null'] }, wechat: { type: [string, 'null'], description: GET /me only }, whatsapp: { type: [string, 'null'], description: GET /me only }, linkedin: { type: [string, 'null'], description: GET /me only }, wechat_visibility: { $ref: '#/components/schemas/Visibility' }, whatsapp_visibility: { $ref: '#/components/schemas/Visibility' }, linkedin_visibility: { $ref: '#/components/schemas/Visibility' }, email_visibility: { $ref: '#/components/schemas/Visibility' }, phone_visibility: { $ref: '#/components/schemas/Visibility' }, is_online: { type: boolean }, created_at: { type: string, format: date-time } } }
    UserUpdate: { type: object, properties: { name: { type: string }, bio: { type: string }, avatar_media_id: { type: string }, grade_year: { type: string }, wechat: { type: string }, whatsapp: { type: string }, linkedin: { type: string }, wechat_visibility: { $ref: '#/components/schemas/Visibility' }, whatsapp_visibility: { $ref: '#/components/schemas/Visibility' }, linkedin_visibility: { $ref: '#/components/schemas/Visibility' }, email_visibility: { $ref: '#/components/schemas/Visibility' }, phone_visibility: { $ref: '#/components/schemas/Visibility' } } }
    UserCreate: { type: object, required: [name, role, password], properties: { name: { type: string }, role: { $ref: '#/components/schemas/Role' }, password: { type: string, description: admin-supplied temporary password }, student_id: { type: string }, email: { type: string }, phone: { type: string }, department_id: { type: string }, program: { type: string }, nationality: { type: string }, grade_year: { type: string }, graduation_year: { type: string } } }
    UserAdminUpdate: { type: object, properties: { name: { type: string }, email: { type: [string, 'null'] }, phone: { type: [string, 'null'] }, student_id: { type: [string, 'null'] }, department_id: { type: [string, 'null'] }, program: { type: [string, 'null'] }, nationality: { type: [string, 'null'] }, grade_year: { type: [string, 'null'] }, graduation_year: { type: [string, 'null'] }, role: { $ref: '#/components/schemas/Role' } } }
    RoleStrategy: { type: object, properties: { role: { $ref: '#/components/schemas/Role' }, can_view_info: { type: boolean }, can_view_internal: { type: boolean }, can_view_alumni: { type: boolean }, can_view_forum: { type: boolean }, can_submit_info: { type: boolean }, can_post_forum: { type: boolean }, can_comment: { type: boolean }, can_create_profile: { type: boolean } } }

    MediaObject: { type: object, properties: { id: { type: string }, kind: { type: string, enum: [image, attachment, avatar] }, url: { type: string }, file_name: { type: string }, mime_type: { type: string }, size_bytes: { type: integer }, width: { type: [integer, 'null'] }, height: { type: [integer, 'null'] }, thumbnail_key: { type: [string, 'null'] } } }
    MediaRequest: { type: object, required: [kind, file_name, mime_type, size_bytes], properties: { kind: { type: string, enum: [image, attachment, avatar] }, file_name: { type: string }, mime_type: { type: string }, size_bytes: { type: integer }, sha256: { type: string } } }
    MediaUpload: { type: object, properties: { media_id: { type: string }, upload_url: { type: string }, expires_at: { type: string, format: date-time } } }

    InfoPost: { type: object, properties: { id: { type: string }, title: { type: string }, content: { type: string }, category: { $ref: '#/components/schemas/InfoCategory' }, source: { $ref: '#/components/schemas/InfoSource' }, visibility: { $ref: '#/components/schemas/Visibility' }, status: { $ref: '#/components/schemas/ContentStatus' }, pinned: { type: boolean }, version: { type: integer }, author: { $ref: '#/components/schemas/User' }, media: { type: array, items: { $ref: '#/components/schemas/MediaObject' } }, created_at: { type: string, format: date-time }, edited_at: { type: [string, 'null'], format: date-time } } }
    InfoCreate: { type: object, required: [title, content], properties: { title: { type: string, maxLength: 200 }, content: { type: string }, category: { $ref: '#/components/schemas/InfoCategory' }, visibility: { $ref: '#/components/schemas/Visibility' }, media_ids: { type: array, items: { type: string } } } }

    AlumniProfile: { type: object, properties: { id: { type: string }, display_name: { type: string }, department: { $ref: '#/components/schemas/Department' }, graduation_year: { type: [string, 'null'] }, program: { type: [string, 'null'] }, industry: { type: [string, 'null'] }, country: { type: [string, 'null'] }, city: { type: [string, 'null'] }, work_title: { type: [string, 'null'] }, company: { type: [string, 'null'] }, bio: { type: [string, 'null'] }, skills: { type: array, items: { type: string } }, source: { $ref: '#/components/schemas/ProfileSource' }, status: { $ref: '#/components/schemas/ProfileStatus' }, visibility: { $ref: '#/components/schemas/Visibility' }, email: { type: [string, 'null'], description: omitted unless the owner account's email_visibility + role allowed }, phone: { type: [string, 'null'], description: omitted unless the owner account's phone_visibility + role allowed }, wechat: { type: [string, 'null'], description: omitted unless the owner account's wechat_visibility + role allowed }, whatsapp: { type: [string, 'null'], description: omitted unless the owner account's whatsapp_visibility + role allowed }, linkedin: { type: [string, 'null'], description: omitted unless the owner account's linkedin_visibility + role allowed }, completion_percent: { type: integer }, version: { type: integer }, avatar_url: { type: [string, 'null'] } } }
    AlumniUpdate: { type: object, properties: { display_name: { type: string }, department_id: { type: string }, graduation_year: { type: string }, program: { type: string }, industry: { type: string }, country: { type: string }, city: { type: string }, work_title: { type: string }, company: { type: string }, bio: { type: string }, visibility: { $ref: '#/components/schemas/Visibility' } } }

    FacultyMember: { type: object, properties: { id: { type: string }, name: { type: string }, department: { $ref: '#/components/schemas/Department' }, title: { type: string }, research_area: { type: string }, email: { type: [string, 'null'] }, phone: { type: [string, 'null'] }, bio: { type: [string, 'null'] }, avatar_url: { type: [string, 'null'] } } }
    FacultyInput: { type: object, required: [name], properties: { name: { type: string, maxLength: 100 }, department: { type: string, description: department code or id }, title: { type: string, maxLength: 120 }, research_area: { type: string, maxLength: 240 }, email: { type: string }, phone: { type: string, maxLength: 40 }, bio: { type: string, maxLength: 2000 }, avatar_media_id: { type: string }, avatar_url: { type: string }, address: { type: string, maxLength: 240 }, homepage: { type: string, maxLength: 500 } } }

    Tag: { type: object, properties: { id: { type: string }, name: { type: string }, slug: { type: string } } }
    ForumPost: { type: object, properties: { id: { type: string }, title: { type: string }, content: { type: string }, author: { $ref: '#/components/schemas/User' }, status: { $ref: '#/components/schemas/ContentStatus' }, location: { type: [string, 'null'] }, is_pinned: { type: boolean }, tags: { type: array, items: { $ref: '#/components/schemas/Tag' } }, view_count: { type: integer }, like_count: { type: integer }, bookmark_count: { type: integer }, comment_count: { type: integer }, liked: { type: boolean }, bookmarked: { type: boolean }, liked_by: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/User' } }, version: { type: integer }, created_at: { type: string, format: date-time }, last_comment_at: { type: [string, 'null'], format: date-time } } }
    PostCreate: { type: object, required: [title, content], properties: { title: { type: string }, content: { type: string }, location: { type: string }, tags: { type: array, items: { type: string } } } }
    Comment: { type: object, properties: { id: { type: string }, forum_post_id: { type: string }, parent_id: { type: [string, 'null'] }, author: { $ref: '#/components/schemas/User' }, content: { type: string }, status: { $ref: '#/components/schemas/ContentStatus' }, version: { type: integer }, created_at: { type: string, format: date-time } } }
    CommentCreate: { type: object, required: [content], properties: { content: { type: string }, parent_id: { type: [string, 'null'] } } }

    Conversation: { type: object, properties: { id: { type: string }, kind: { type: string, enum: [direct, group] }, participants: { type: array, items: { $ref: '#/components/schemas/User' } }, last_message_at: { type: [string, 'null'], format: date-time }, muted: { type: boolean }, pinned: { type: boolean }, unread_count: { type: integer } } }
    ChatMessage: { type: object, properties: { id: { type: string }, conversation_id: { type: string }, sender: { $ref: '#/components/schemas/User' }, content: { type: string }, media: { oneOf: [ { $ref: '#/components/schemas/MediaObject' }, { type: 'null' } ] }, sent_at: { type: string, format: date-time }, edited_at: { type: [string, 'null'], format: date-time } } }

    Connection: { type: object, properties: { id: { type: string }, from_user: { $ref: '#/components/schemas/User' }, to_user: { $ref: '#/components/schemas/User' }, status: { $ref: '#/components/schemas/ConnectionStatus' }, message: { type: [string, 'null'] }, responded_at: { type: [string, 'null'], format: date-time }, created_at: { type: string, format: date-time } } }

    CampusEvent: { type: object, properties: { id: { type: string }, title: { type: string }, description: { type: string }, starts_at: { type: string, format: date-time }, ends_at: { type: [string, 'null'], format: date-time }, location: { type: string }, organizer: { type: string }, type: { $ref: '#/components/schemas/EventType' }, capacity: { type: integer }, registered_count: { type: integer }, status: { type: string, enum: [draft, published, cancelled, archived] }, cover: { oneOf: [ { $ref: '#/components/schemas/MediaObject' }, { type: 'null' } ] } } }
    EventCreate: { type: object, required: [title, starts_at], properties: { title: { type: string }, description: { type: string }, starts_at: { type: string, format: date-time }, ends_at: { type: string, format: date-time }, location: { type: string }, organizer: { type: string }, type: { $ref: '#/components/schemas/EventType' }, capacity: { type: integer, minimum: 0 }, status: { type: string, enum: [draft, published, cancelled, archived] }, cover_media_id: { type: string } } }
    EventRegistration: { type: object, properties: { event_id: { type: string }, user_id: { type: string }, registered_at: { type: string, format: date-time }, status: { type: string, enum: [registered, attended, cancelled] } } }
    Ticket: { type: object, properties: { token: { type: string, description: Signed, short-lived, single-use }, expires_at: { type: string, format: date-time } } }

    MentorProfile: { type: object, properties: { user: { $ref: '#/components/schemas/User' }, expertise: { type: string }, mentor_area: { type: string }, max_mentees: { type: integer }, current_mentees: { type: integer }, status: { type: string, enum: [pending, active, paused] } } }
    MentorCreate: { type: object, properties: { expertise: { type: string }, mentor_area: { type: string }, max_mentees: { type: integer, default: 3 } } }
    MentorshipApplication: { type: object, properties: { id: { type: string }, mentor: { $ref: '#/components/schemas/User' }, mentee: { $ref: '#/components/schemas/User' }, message: { type: string }, status: { $ref: '#/components/schemas/MentorshipStatus' }, responded_at: { type: [string, 'null'], format: date-time } } }

    # title/subtitle name the polymorphic target; they are absent (not null) once
    # the §2 null-drop runs, i.e. when the saved row no longer resolves to
    # readable content — the client then shows "no longer available".
    Favorite: { type: object, properties: { target_type: { $ref: '#/components/schemas/FavoriteTargetType' }, target_id: { type: string }, created_at: { type: string, format: date-time }, title: { type: [string, 'null'] }, subtitle: { type: [string, 'null'] } } }
    FavoriteCreate: { type: object, required: [target_type, target_id], properties: { target_type: { $ref: '#/components/schemas/FavoriteTargetType' }, target_id: { type: string } } }

    Notification: { type: object, properties: { id: { type: string }, type: { $ref: '#/components/schemas/NotificationType' }, title: { type: string }, body: { type: string }, payload: { type: object, properties: { route: { type: string }, targetType: { type: string }, targetId: { type: string } } }, read_at: { type: [string, 'null'], format: date-time }, created_at: { type: string, format: date-time } } }

    Feedback: { type: object, properties: { id: { type: string }, content: { type: string }, reply: { type: [string, 'null'] }, status: { type: string, enum: [open, answered, closed] }, created_at: { type: string, format: date-time } } }

    Keyword: { type: object, properties: { id: { type: string }, word: { type: string }, action: { $ref: '#/components/schemas/KeywordAction' }, enabled: { type: boolean } } }
    KeywordCreate: { type: object, required: [word, action], properties: { word: { type: string, maxLength: 100 }, action: { $ref: '#/components/schemas/KeywordAction' }, enabled: { type: boolean, default: true } } }
    Report: { type: object, properties: { id: { type: string }, reporter: { $ref: '#/components/schemas/User' }, target_type: { $ref: '#/components/schemas/ReportTargetType' }, target_id: { type: string }, reason: { type: string }, status: { $ref: '#/components/schemas/ReportStatus' }, result_note: { type: [string, 'null'] }, created_at: { type: string, format: date-time } } }
    ReportCreate: { type: object, required: [reason], properties: { reason: { type: string, maxLength: 500 } } }
    ModerationAction: { type: object, properties: { id: { type: string }, target_type: { $ref: '#/components/schemas/ModerationTargetType' }, target_id: { type: string }, actor: { oneOf: [ { $ref: '#/components/schemas/User' }, { type: 'null' } ], description: null = keyword engine / system }, action: { type: string, enum: [submitted, approved, rejected, taken_down, removed, resubmitted] }, reason: { type: [string, 'null'] }, created_at: { type: string, format: date-time } } }
    OperationLog: { type: object, properties: { id: { type: string }, admin: { $ref: '#/components/schemas/User' }, action: { type: string }, target_type: { type: [string, 'null'] }, target_id: { type: [string, 'null'] }, detail: { type: object, additionalProperties: true }, ip: { type: [string, 'null'] }, created_at: { type: string, format: date-time } } }
    ReviewQueueItem: { type: object, properties: { target_type: { $ref: '#/components/schemas/ModerationTargetType' }, target_id: { type: string }, title: { type: string }, submitted_at: { type: string, format: date-time }, author: { $ref: '#/components/schemas/User' } } }

    # ---- auth: otp / reset ----
    ForgotPasswordRequest: { type: object, required: [identifier], properties: { identifier: { type: string } } }
    ResetPasswordRequest: { type: object, required: [identifier, code, new_password], properties: { identifier: { type: string }, code: { type: string }, new_password: { type: string } } }
