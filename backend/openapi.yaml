openapi: 3.1.0
info:
  title: THUIE API
  version: 1.0.0-draft
  description: >-
    REST + WebSocket contract for the THUIE campus alumni info-exchange
    platform. Design skeleton - mirrors BACKEND.md and the PostgreSQL schema in
    PROJECT.md 6. Server implementation deferred to the build phase.
  license: { name: Proprietary }
servers:
  - url: https://api.thuie.example.com/api/v1
    description: Production (placeholder)
  - url: http://localhost:3000/api/v1
    description: Local development

# OpenAPI has no native WebSocket binding, so the realtime surface (BACKEND.md §9)
# is documented here as a vendor extension. Socket.IO server, namespace
# `/realtime`, authenticated with the same access JWT supplied via handshake
# `auth.token`, an `Authorization: Bearer` header, or a `?token=` query.
x-websocket:
  namespace: /realtime
  transport: socket.io
  auth: access JWT (handshake auth.token | Authorization header | ?token= query)
  rooms: { user: "user:<id>", conversation: "conv:<id>", admin: "role:admin" }
  client_to_server:
    - { event: "conversation:join", body: { conversationId: string } }
    - { event: "conversation:leave", body: { conversationId: string } }
    - { event: "typing:start", body: { conversationId: string } }
    - { event: "typing:stop", body: { conversationId: string } }
  server_to_client:
    - { event: "message:new", payload: "{ conversationId, message }", room: "conv:<id>" }
    - { event: "message:read", payload: "{ conversationId, userId, lastReadAt }", room: "conv:<id>" }
    - { event: "typing:start", payload: "{ conversationId, userId }", room: "conv:<id> (except sender)" }
    - { event: "typing:stop", payload: "{ conversationId, userId }", room: "conv:<id> (except sender)" }
    - { event: "notification:new", payload: Notification, room: "user:<id>" }
    - { event: "moderation:status", payload: "Record<string, unknown>", room: "role:admin" }
    - { event: "presence:update", payload: "{ userId, isOnline, lastSeenAt }", room: broadcast }
    - { event: "unauthorized", payload: "{ reason }", note: then hard disconnect }

tags:
  - { name: Auth }
  - { name: Users }
  - { name: Departments }
  - { name: Infos }
  - { name: Alumni }
  - { name: Faculty }
  - { name: Forum }
  - { name: Messaging }
  - { name: Connections }
  - { name: Events }
  - { name: Mentorship }
  - { name: Engagement }
  - { name: Notifications }
  - { name: Search }
  - { name: Feedback }
  - { name: Media }
  - { name: Admin }
  - { name: System }

security:
  - bearerAuth: []

paths:
  # ---- Auth ----
  /auth/login:
    post: { tags: [Auth], security: [], operationId: login, summary: Authenticate with handle + password,
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } },
      responses: { '200': { description: Token pair + user, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }, default: { $ref: '#/components/responses/Error' } } }
  /auth/refresh:
    post: { tags: [Auth], security: [], operationId: refreshToken, summary: Rotate refresh token,
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { refresh_token: { type: string } } } } } },
      responses: { '200': { description: New token pair, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }, default: { $ref: '#/components/responses/Error' } } }
  /auth/logout:
    post: { tags: [Auth], operationId: logout, summary: Revoke presented refresh token (or the whole device family),
      requestBody: { content: { application/json: { schema: { type: object, properties: { refresh_token: { type: string }, all_devices: { type: boolean } } } } } },
      responses: { '200': { description: Logged out }, default: { $ref: '#/components/responses/Error' } } }
  /auth/register:
    post: { tags: [Auth], security: [], operationId: register, summary: Student self-signup,
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ],
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } } },
      responses: { '201': { description: Created user + tokens, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }, default: { $ref: '#/components/responses/Error' } } }
  /auth/password:
    patch: { tags: [Auth], operationId: changePassword, summary: Change password (invalidates older tokens),
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [current_password, new_password], properties: { current_password: { type: string }, new_password: { type: string } } } } } },
      responses: { '200': { description: Updated }, default: { $ref: '#/components/responses/Error' } } }
  # ---- Users / me ----
  /me:
    get: { tags: [Users], operationId: getMe, summary: Current user, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }, default: { $ref: '#/components/responses/Error' } } }
    patch: { tags: [Users], operationId: updateMe, summary: Update profile fields, requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/UserUpdate' } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }, default: { $ref: '#/components/responses/Error' } } }
    delete: { tags: [Users], operationId: deleteMe, summary: Soft delete + PII scrub, responses: { '204': { description: deleted }, default: { $ref: '#/components/responses/Error' } } }
  /me/role-strategy:
    get: { tags: [Users], operationId: getMyRoleStrategy, summary: Effective permission flags, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/RoleStrategy' } } } }, default: { $ref: '#/components/responses/Error' } } }
  /me/push-token:
    post: { tags: [Users], operationId: registerPushToken, summary: Register FCM push token, requestBody: { content: { application/json: { schema: { type: object, properties: { token: { type: string }, platform: { type: string } } } } } }, responses: { '204': { description: stored }, default: { $ref: '#/components/responses/Error' } } }
    delete: { tags: [Users], operationId: unregisterPushToken, summary: Unregister a push token, parameters: [ { in: query, name: token, required: true, schema: { type: string } } ], responses: { '204': { description: removed }, default: { $ref: '#/components/responses/Error' } } }

  # ---- Departments ----
  /departments:
    get: { tags: [Departments], security: [], operationId: listDepartments, summary: Public department registry, responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Department' } } } } }, default: { $ref: '#/components/responses/Error' } } }

  # ---- Infos ----
  /infos:
    get: { tags: [Infos], operationId: listInfos, summary: Info feed (cursor), parameters: [ { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }, { in: query, name: category, schema: { $ref: '#/components/schemas/InfoCategory' } }, { $ref: '#/components/parameters/Sort' } ], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/InfoPostPage' } } } }, default: { $ref: '#/components/responses/Error' } } }
    post: { tags: [Infos], operationId: createInfo, summary: Submit info (-> moderation), parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InfoCreate' } } } }, responses: { '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/InfoPost' } } } }, '422': { description: keyword blocked, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, default: { $ref: '#/components/responses/Error' } } }
  /infos/{id}:
    get: { tags: [Infos], operationId: getInfo, summary: Single info, parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/InfoPost' } } } }, '404': { $ref: '#/components/responses/NotFound' }, default: { $ref: '#/components/responses/Error' } } }
    patch: { tags: [Infos], operationId: updateInfo, summary: Author edit (approved -> re-review), parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/InfoCreate' } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/InfoPost' } } } }, default: { $ref: '#/components/responses/Error' } } }
    delete: { tags: [Infos], operationId: deleteInfo, summary: Author takedown, parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '204': { description: taken down }, default: { $ref: '#/components/responses/Error' } } }
  /infos/{id}/report:
    post: { tags: [Infos], operationId: reportInfo, summary: Report an info post, parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ReportCreate' } } } }, responses: { '202': { description: filed }, default: { $ref: '#/components/responses/Error' } } }

  # ---- Alumni ----
  /alumni:
    get: { tags: [Alumni], operationId: listAlumni, summary: Browse alumni, parameters: [ { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }, { in: query, name: department, schema: { type: string } }, { in: query, name: skill, schema: { type: string } }, { in: query, name: q, schema: { type: string } }, { in: query, name: graduation_year, schema: { type: string } }, { in: query, name: company, schema: { type: string } }, { in: query, name: program, schema: { type: string } }, { in: query, name: country, schema: { type: string } } ], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/AlumniPage' } } } }, default: { $ref: '#/components/responses/Error' } } }
  /alumni/{id}:
    get: { tags: [Alumni], operationId: getAlumni, summary: Alumni profile (contact gated), parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/AlumniProfile' } } } }, '404': { $ref: '#/components/responses/NotFound' }, default: { $ref: '#/components/responses/Error' } } }
  /alumni/{id}/connections:
    get: { tags: [Alumni], operationId: listAlumniConnections, summary: Connections of a profile, parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AlumniProfile' } } } } }, default: { $ref: '#/components/responses/Error' } } }
  /me/alumni-profile:
    get: { tags: [Alumni], operationId: getMyAlumniProfile, summary: Own profile incl drafts/rejected, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/AlumniProfile' } } } }, default: { $ref: '#/components/responses/Error' } } }
    post: { tags: [Alumni], operationId: createMyAlumniProfile, summary: Create own profile, requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/AlumniUpdate' } } } }, responses: { '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/AlumniProfile' } } } }, default: { $ref: '#/components/responses/Error' } } }
    patch: { tags: [Alumni], operationId: updateMyAlumniProfile, summary: Edit own profile, requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/AlumniUpdate' } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/AlumniProfile' } } } }, default: { $ref: '#/components/responses/Error' } } }
  /me/alumni-profile/skills:
    put: { tags: [Alumni], operationId: setMySkills, summary: Replace skill set, requestBody: { content: { application/json: { schema: { type: object, properties: { skills: { type: array, items: { type: string } } } } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/AlumniProfile' } } } }, default: { $ref: '#/components/responses/Error' } } }

  # ---- Faculty ----
  /faculty:
    get: { tags: [Faculty], operationId: listFaculty, summary: Faculty directory, parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }, { in: query, name: department, schema: { type: string } }, { in: query, name: q, schema: { type: string } } ], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/FacultyPage' } } } }, default: { $ref: '#/components/responses/Error' } } }
  /faculty/{id}:
    get: { tags: [Faculty], operationId: getFaculty, summary: Faculty member, parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/FacultyMember' } } } }, '404': { $ref: '#/components/responses/NotFound' }, default: { $ref: '#/components/responses/Error' } } }

  # ---- Forum ----
  /posts:
    get: { tags: [Forum], operationId: listPosts, summary: Forum feed (cursor), parameters: [ { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }, { in: query, name: tag, schema: { type: string } }, { in: query, name: q, schema: { type: string } } ], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ForumPostPage' } } } }, default: { $ref: '#/components/responses/Error' } } }
    post: { tags: [Forum], operationId: createPost, summary: Submit post (-> moderation), parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ], requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/PostCreate' } } } }, responses: { '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/ForumPost' } } } }, default: { $ref: '#/components/responses/Error' } } }
  /posts/{id}:
    get: { tags: [Forum], operationId: getPost, summary: Post detail (view counted), parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ForumPost' } } } }, '404': { $ref: '#/components/responses/NotFound' }, default: { $ref: '#/components/responses/Error' } } }
    patch: { tags: [Forum], operationId: updatePost, summary: Author edit, parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/PostCreate' } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ForumPost' } } } }, default: { $ref: '#/components/responses/Error' } } }
    delete: { tags: [Forum], operationId: deletePost, summary: Author takedown, parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '204': { description: taken down }, default: { $ref: '#/components/responses/Error' } } }
  /posts/{id}/like:
    post: { tags: [Forum], operationId: toggleLike, summary: Toggle like, parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ForumPost' } } } }, default: { $ref: '#/components/responses/Error' } } }
  /posts/{id}/bookmark:
    post: { tags: [Forum], operationId: toggleBookmark, summary: Toggle bookmark (favorites(post)), parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ForumPost' } } } }, default: { $ref: '#/components/responses/Error' } } }
  /posts/{id}/comments:
    get: { tags: [Forum], operationId: listComments, summary: Comment thread, parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/CommentPage' } } } }, default: { $ref: '#/components/responses/Error' } } }
    post: { tags: [Forum], operationId: createComment, summary: Add comment (keyword-pass -> approved), parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ], requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/CommentCreate' } } } }, responses: { '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Comment' } } } }, default: { $ref: '#/components/responses/Error' } } }
  /posts/{id}/report:
    post: { tags: [Forum], operationId: reportPost, summary: Report a post, parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ReportCreate' } } } }, responses: { '201': { description: filed }, default: { $ref: '#/components/responses/Error' } } }
  /comments/{id}:
    patch: { tags: [Forum], operationId: updateComment, summary: Edit comment (version-checked), parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { content: { application/json: { schema: { type: object, properties: { content: { type: string }, version: { type: integer } } } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Comment' } } } }, '412': { description: version conflict, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, default: { $ref: '#/components/responses/Error' } } }
    delete: { tags: [Forum], operationId: deleteComment, summary: Author takedown, parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '204': { description: taken down }, default: { $ref: '#/components/responses/Error' } } }
  /comments/{id}/report:
    post: { tags: [Forum], operationId: reportComment, summary: Report a comment, parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ReportCreate' } } } }, responses: { '201': { description: filed }, default: { $ref: '#/components/responses/Error' } } }
  /tags:
    get: { tags: [Forum], operationId: listTags, summary: Tag dictionary, responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Tag' } } } } }, default: { $ref: '#/components/responses/Error' } } }

  # ---- Messaging ----
  /conversations:
    get: { tags: [Messaging], operationId: listConversations, summary: Conversations by last_message_at, responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Conversation' } } } } }, default: { $ref: '#/components/responses/Error' } } }
    post: { tags: [Messaging], operationId: createConversation, summary: Open/find DM (pair_key dedupe) or create group, parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ], requestBody: { content: { application/json: { schema: { type: object, properties: { participant_id: { type: string, description: 'Peer id for a DM. Reuses the existing pair conversation, opening it if absent.' }, participant_ids: { type: array, items: { type: string }, description: 'Creates a group (empty group allowed).' }, title: { type: string }, content: { type: string, maxLength: 5000, description: 'Optional first message, sent atomically into the DM. The web sends this only from the draft composer, so it never opens an empty conversation.' } } } } } }, responses: { '201': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } } }, default: { $ref: '#/components/responses/Error' } } }
  /conversations/{id}/messages:
    get: { tags: [Messaging], operationId: listMessages, summary: Message history (cursor id DESC), parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/MessagePage' } } } }, default: { $ref: '#/components/responses/Error' } } }
    post: { tags: [Messaging], operationId: sendMessage, summary: Send message (also WS broadcast), parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ], requestBody: { content: { application/json: { schema: { type: object, properties: { content: { type: string }, media_id: { type: string } } } } } }, responses: { '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/ChatMessage' } } } }, default: { $ref: '#/components/responses/Error' } } }
  /conversations/{id}/messages/{messageId}:
    delete: { tags: [Messaging], operationId: deleteMessage, summary: Delete own message, parameters: [ { $ref: '#/components/parameters/Id' }, { in: path, name: messageId, required: true, schema: { type: string } } ], responses: { '204': { description: deleted }, default: { $ref: '#/components/responses/Error' } } }
  /conversations/{id}/read:
    post: { tags: [Messaging], operationId: markConversationRead, summary: Set caller last_read_at, parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { content: { application/json: { schema: { type: object, properties: { last_read_at: { type: string, format: date-time } } } } } }, responses: { '201': { description: ok }, default: { $ref: '#/components/responses/Error' } } }
  /conversations/{id}:
    patch: { tags: [Messaging], operationId: updateConversation, summary: Mute / pin, parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { content: { application/json: { schema: { type: object, properties: { muted: { type: boolean }, pinned: { type: boolean } } } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } } }, default: { $ref: '#/components/responses/Error' } } }

  # ---- Connections ----
  /connections:
    get: { tags: [Connections], operationId: listConnections, summary: requests | mine, parameters: [ { in: query, name: box, schema: { type: string, enum: [requests, mine] } } ], responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Connection' } } } } }, default: { $ref: '#/components/responses/Error' } } }
    post: { tags: [Connections], operationId: createConnection, summary: Send connection request, parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ], requestBody: { content: { application/json: { schema: { type: object, properties: { to_user_id: { type: string }, message: { type: string } } } } } }, responses: { '201': { description: pending, content: { application/json: { schema: { $ref: '#/components/schemas/Connection' } } } }, default: { $ref: '#/components/responses/Error' } } }
  /connections/{id}:
    patch: { tags: [Connections], operationId: respondConnection, summary: accept / decline / revoke, parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { content: { application/json: { schema: { type: object, properties: { status: { $ref: '#/components/schemas/ConnectionStatus' } } } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Connection' } } } }, default: { $ref: '#/components/responses/Error' } } }

  # ---- Events ----
  /events:
    get: { tags: [Events], operationId: listEvents, summary: Published events, parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }, { in: query, name: type, schema: { $ref: '#/components/schemas/EventType' } } ], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/EventPage' } } } }, default: { $ref: '#/components/responses/Error' } } }
    post: { tags: [Events], operationId: createEvent, summary: Admin create event, requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/EventCreate' } } } }, responses: { '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/CampusEvent' } } } }, default: { $ref: '#/components/responses/Error' } } }
  /events/{id}:
    get: { tags: [Events], operationId: getEvent, summary: Event detail, parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/CampusEvent' } } } }, '404': { $ref: '#/components/responses/NotFound' }, default: { $ref: '#/components/responses/Error' } } }
    patch: { tags: [Events], operationId: updateEvent, summary: Admin edit / status, parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/EventCreate' } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/CampusEvent' } } } }, default: { $ref: '#/components/responses/Error' } } }
  /events/{id}/register:
    post: { tags: [Events], operationId: registerEvent, summary: Register (capacity lock), parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ], responses: { '201': { description: registered, content: { application/json: { schema: { $ref: '#/components/schemas/EventRegistration' } } } }, '409': { description: capacity reached, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, default: { $ref: '#/components/responses/Error' } } }
    delete: { tags: [Events], operationId: cancelRegistration, summary: Cancel own registration, parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '204': { description: cancelled }, default: { $ref: '#/components/responses/Error' } } }
  /events/{id}/ticket:
