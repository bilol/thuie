name: thuie
description: THUIE - Campus Alumni Information Exchange Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  image_picker: ^1.0.7
  lucide_icons_flutter: ^3.1.20
  share_plus: ^10.1.4
  qr_flutter: ^4.1.0
  local_auth: ^2.3.0
  enough_mail: ^2.1.6
  flutter_secure_storage: ^9.0.0
  dio: ^5.7.0
  socket_io_client: ^2.0.3+1
  uuid: ^4.4.2
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
